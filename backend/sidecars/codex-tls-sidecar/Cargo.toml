[package]
name = "codex-tls-sidecar"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 严格对齐 codex 真实编译产物：
#   - target: x86_64-unknown-linux-musl (静态链接)
#   - TLS: musl 不能用 native-tls/OpenSSL，所以 reqwest 用 rustls + aws-lc-rs
#   - 这是 codex 0.141.0 npm 包里的 ELF static-pie linked binary 实情
reqwest = { version = "0.12", default-features = false, features = ["cookies", "stream", "rustls-tls", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }

# 服务端 / runtime
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "http2"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"

# 序列化 / 流
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# base64 编码 body（避免 JSON 中带二进制问题）
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
